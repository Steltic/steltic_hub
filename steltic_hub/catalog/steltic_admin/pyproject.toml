[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steltic-admin"
version = "0.1.0"
description = "Admin for the Steltic hub: batch plans across modules, run monitoring, a standards-conversion queue and a help desk over the code and docs"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["admin"]
