<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probabilistic analysis</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  :root{--accent:#9fd0ff}
  .about{border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:14px;background:var(--panel2)}
  .about h4{font-size:13px;color:#fff;margin:0 0 6px}
  .about p{font-size:13px;color:var(--dim);margin:6px 0;max-width:960px}
  .about b{color:var(--ink);font-weight:500}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
  .stat{border:1px solid var(--line);border-radius:7px;padding:9px 12px}
  .stat .l{font-size:11px;color:var(--dimmer);letter-spacing:.04em;text-transform:uppercase}
  .stat .v{font-size:18px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
  .stat .s{font-size:11px;color:var(--dim)}
  .plot svg{max-width:100%;height:auto;display:block}
  .vars td input[type=number]{width:90px;padding:3px 6px}
  .vars td.src{font-size:11.5px;color:var(--dimmer);max-width:520px}
  .vars td.what{font-size:12px;color:var(--dim);max-width:420px}
  details summary{cursor:pointer;color:var(--dim);font-size:12.5px;padding:4px 0}
  .bar{height:8px;background:#0f1216;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}
  .kv{font-size:12px;color:var(--dim)} .kv b{color:var(--ink);font-weight:500}
  .assess li{margin:5px 0;font-size:13px}
  .rho{display:inline-block;height:8px;background:var(--info);border-radius:2px;vertical-align:middle}
</style>
</head>
<body>
<header id="top">
  <span class="brand">Steltic <b>Probabilistic analysis</b></span>
  <span id="projname" class="proj"></span>
  <span class="sp"></span>
  <span id="status" class="note"></span>
</header>
<nav id="steps"></nav>
<main id="main"></main>
<div id="toasts"></div>
<div id="modal" hidden><div class="box"><div class="mh"></div><div class="mb"></div><div class="mf"></div></div></div>
<script src="/static/app.js"></script>
</body>
</html>
