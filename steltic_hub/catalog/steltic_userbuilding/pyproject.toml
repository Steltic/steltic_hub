[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steltic-userbuilding"
version = "0.2.0"
description = "User-designed building: bring a steel building you designed (template or ETABS .e2k); HR Steel models it as given (build-only, no redesign) and the Nonlinear module runs its full suite on it"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27", "python-multipart>=0.0.9", "steltic-openbim[hub] @ git+https://github.com/Steltic/steltic_openBIM@af84f551a7c0f6c18a535981a17774113e117ae2"]

[tool.hatch.build.targets.wheel]
packages = ["userbuilding"]

[tool.hatch.metadata]
allow-direct-references = true
